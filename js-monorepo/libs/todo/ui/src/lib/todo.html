<section class="todo-shell">
  <header class="todo-shell__header">
    <h1 class="todo-shell__title">Todo List</h1>
    <div class="todo-shell__actions">
      <button
        class="todo-shell__action-btn"
        type="button"
        (click)="onSetFiltersClick()"
      >
        Set Filters
      </button>
      <button class="todo-shell__action-btn" type="button" (click)="onAddTodoClick()">
        Add Todo
      </button>
    </div>
  </header>

  @if (todos().length === 0) {
    <p class="todo-empty">There are no todos yet</p>
  } @else {
    <div class="todo-grid">
      @for (todo of todos(); track todo.id) {
        @if (!todo.completed) {
          <todo-item [todo]="todo"></todo-item>
        }
      }

      @for (todo of todos(); track todo.id) {
        @if (todo.completed) {
          <todo-item [todo]="todo"></todo-item>
        }
      }
    </div>
  }
</section>

@if (researchPanelOpen()) {
  <div
    class="todo-research-backdrop"
    (click)="_researchService.closePanel()"
    aria-hidden="true"
  ></div>
  <aside class="todo-research-panel" role="dialog" aria-label="Research panel">
    <todo-research-panel />
  </aside>
}
