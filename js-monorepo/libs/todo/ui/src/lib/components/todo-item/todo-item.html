<mat-list-item class="todo-item">
  <mat-checkbox
    matListItemIcon
    [checked]="todo().completed"
    [attr.aria-label]="
      todo().completed ? 'Task completed' : 'Task not completed'
			"
    (click)="onToggleCompleted()"
  />

  <span matListItemTitle class="todo-item__title-row">
    <span class="todo-item__title-text">{{ todo().title }}</span>
    @if (tags().length) {
    <span class="todo-item__tags todo-item__tags--inline">
      @for (tag of tags(); track tag.id) {
      <todo-tag-pill [tag]="tag" />
      }
    </span>
    }
    @if (todo().dueDate) {
    <todo-due-date-indicator
      class="todo-item__due-date"
      [dueDate]="todo().dueDate"
    />
    }
  </span>

  <span
    matListItemLine
    class="todo-item__description-line"
    [class.todo-item__description-line--placeholder]="!hasDescription()"
  >
    <span
      class="todo-item__description-text"
      [class.todo-item__description-text--expanded]="isDescriptionExpanded"
    >
      {{ descriptionText() }}
    </span>
    @if (hasDescription()) {
    <button
      mat-button
      type="button"
      class="todo-item__description-toggle"
      [attr.aria-label]="
        isDescriptionExpanded ? 'Collapse description' : 'Expand description'
      "
      (click)="onDescriptionToggle()"
    >
      {{ isDescriptionExpanded ? 'Less' : '...' }}
    </button>
    }
  </span>

  <div matListItemMeta class="todo-item__actions">
    <button mat-button type="button" (click)="onEdit()">Edit</button>
    <button mat-button color="warn" type="button" (click)="onDelete()">
      Delete
    </button>
  </div>
</mat-list-item>
