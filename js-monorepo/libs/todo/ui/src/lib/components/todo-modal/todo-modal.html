<h2 mat-dialog-title>{{ title }}</h2>

<mat-dialog-content>
  <form [formGroup]="fg" class="todo-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Title</mat-label>
      <input matInput formControlName="title" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" rows="4"></textarea>
    </mat-form-field>

    <mat-checkbox formControlName="completed">Completed</mat-checkbox>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Due Date</mat-label>
      <input
        matInput
        formControlName="dueDate"
        [matDatepicker]="dueDatePicker"
      />
      <mat-datepicker-toggle
        matSuffix
        [for]="dueDatePicker"
      ></mat-datepicker-toggle>
      <mat-datepicker #dueDatePicker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Tags</mat-label>
      <mat-select formControlName="tags" multiple>
        @for(tag of tags(); track tag.id) {
        <mat-option [value]="tag.id"> {{ tag.name }} </mat-option>
        }
      </mat-select>
    </mat-form-field>
    @if (mode === 'create') {
    <mat-checkbox formControlName="research">Research</mat-checkbox>
    }
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-flat-button [disabled]="fg.invalid" (click)="submitForm()">
    {{ mode === 'create' ? 'Add task' : 'Save task' }}
  </button>
</mat-dialog-actions>
