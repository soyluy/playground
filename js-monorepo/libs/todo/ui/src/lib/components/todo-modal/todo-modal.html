<h2 class="hub-modal__title">{{ title }}</h2>

<div class="hub-modal__body">
  <form [formGroup]="fg" class="hub-modal__body">
    <div class="hub-field">
      <label class="hub-field__label" for="todo-title">Title</label>
      <input id="todo-title" class="hub-input" formControlName="title" />
    </div>

    <div class="hub-field">
      <label class="hub-field__label" for="todo-description">Description</label>
      <textarea
        id="todo-description"
        class="hub-textarea"
        formControlName="description"
        rows="4"
      ></textarea>
    </div>

    <label class="hub-checkbox">
      <input type="checkbox" formControlName="completed" />
      <span>Completed</span>
    </label>

    <div class="hub-field">
      <label class="hub-field__label" for="todo-due-date">Due Date</label>
      <input
        id="todo-due-date"
        type="date"
        class="hub-input"
        [value]="dueDateInputValue"
        (change)="onDueDateChange($event)"
      />
    </div>

    <div class="hub-field">
      <label class="hub-field__label" for="todo-tags">Tags</label>
      <select id="todo-tags" class="hub-select" formControlName="tags" multiple>
        @for (tag of tags(); track tag.id) {
          <option [ngValue]="tag.id">{{ tag.name }}</option>
        }
      </select>
    </div>

    @if (mode === 'create') {
      <label class="hub-checkbox">
        <input type="checkbox" formControlName="research" />
        <span>Research</span>
      </label>
    }
  </form>
</div>

<div class="hub-modal__actions">
  <button class="hub-btn" type="button" (click)="onCancel()">Cancel</button>
  <button
    class="hub-btn hub-btn--primary"
    type="button"
    [disabled]="fg.invalid"
    (click)="submitForm()"
  >
    {{ mode === 'create' ? 'Add task' : 'Save task' }}
  </button>
</div>
