<div class="tag-management">
  <h2>Tag Management</h2>
  <div class="tag-display-container">
    @for (tag of tags(); track tag.id) {
    <todo-tag-display [tag]="tag"></todo-tag-display>
    }
  </div>
  <div class="tag-management__footer">
    <button mat-flat-button (click)="onAddTag()">Add tag</button>
  </div>
</div>
