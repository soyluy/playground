<h2 class="hub-modal__title">Filter Todos</h2>

<div class="hub-modal__body">
  <form [formGroup]="form" class="hub-modal__body">
    <div class="hub-field">
      <label class="hub-field__label" for="todo-filter-search">Search</label>
      <input id="todo-filter-search" class="hub-input" formControlName="search" />
    </div>

    <div class="hub-field">
      <label class="hub-field__label" for="todo-filter-tags">Tags (any of)</label>
      <select id="todo-filter-tags" class="hub-select" formControlName="tags" multiple>
        @for (tag of tags(); track tag.id) {
          <option [ngValue]="tag.id">{{ tag.name }}</option>
        }
      </select>
    </div>

    <div class="hub-field">
      <label class="hub-field__label" for="todo-filter-include-tags"
        >Must include all tags</label
      >
      <select
        id="todo-filter-include-tags"
        class="hub-select"
        formControlName="allIncludeTags"
        multiple
      >
        @for (tag of tags(); track tag.id) {
          <option [ngValue]="tag.id">{{ tag.name }}</option>
        }
      </select>
    </div>

    <div class="hub-field">
      <label class="hub-field__label" for="todo-filter-exclude-tags"
        >Exclude all tags</label
      >
      <select
        id="todo-filter-exclude-tags"
        class="hub-select"
        formControlName="allExcludeTags"
        multiple
      >
        @for (tag of tags(); track tag.id) {
          <option [ngValue]="tag.id">{{ tag.name }}</option>
        }
      </select>
    </div>

    <div class="hub-field">
      <label class="hub-field__label" for="todo-filter-completed">Completed</label>
      <select id="todo-filter-completed" class="hub-select" formControlName="completed">
        <option [ngValue]="null">Any</option>
        <option [ngValue]="true">Completed</option>
        <option [ngValue]="false">Not completed</option>
      </select>
    </div>

    <div class="hub-field">
      <label class="hub-field__label" for="todo-filter-sort-by">Sort by</label>
      <select id="todo-filter-sort-by" class="hub-select" formControlName="sortBy">
        <option [ngValue]="null">None</option>
        <option value="title">Title</option>
        <option value="dueDate">Due Date</option>
        <option value="createdAt">Created At</option>
        <option value="updatedAt">Updated At</option>
      </select>
    </div>

    <div class="hub-field">
      <label class="hub-field__label" for="todo-filter-sort-order">Sort order</label>
      <select
        id="todo-filter-sort-order"
        class="hub-select"
        formControlName="sortOrder"
      >
        <option [ngValue]="null">None</option>
        <option value="asc">Ascending</option>
        <option value="desc">Descending</option>
      </select>
    </div>

    <div class="hub-field">
      <label class="hub-field__label" for="todo-filter-before-date">Due date before</label>
      <input
        id="todo-filter-before-date"
        type="date"
        class="hub-input"
        [value]="dueDateBeforeInputValue"
        (change)="onDueDateBeforeChange($event)"
      />
    </div>

    <div class="hub-field">
      <label class="hub-field__label" for="todo-filter-after-date">Due date after</label>
      <input
        id="todo-filter-after-date"
        type="date"
        class="hub-input"
        [value]="dueDateAfterInputValue"
        (change)="onDueDateAfterChange($event)"
      />
    </div>
  </form>
</div>

<div class="hub-modal__actions">
  <button class="hub-btn" type="button" (click)="onCancelClick()">Cancel</button>
  <button class="hub-btn hub-btn--primary" type="button" (click)="onSubmitClick()">
    Apply
  </button>
</div>
