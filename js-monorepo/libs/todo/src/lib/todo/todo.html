<h1>Todo List</h1>
<button (click)="onAddTodoClick()">Add Todo</button>
@for (todo of todos(); track todo.id) {
<div>
  <h3>{{ todo.title }}</h3>
  <p>{{ todo.description }}</p>
  <p>{{ todo.completed }}</p>
  <p>{{ todo.createdAt }}</p>
  <p>{{ todo.updatedAt }}</p>
</div>
} @empty {
<h2>There are no todos yet</h2>
}
