<h2 class="hub-modal__title">{{ title }}</h2>

<div class="hub-modal__body">
  <form [formGroup]="fg" class="hub-modal__body">
    <div class="hub-field">
      <label class="hub-field__label" for="resource-title">Title</label>
      <input id="resource-title" class="hub-input" formControlName="title" />
    </div>

    <div class="hub-field">
      <label class="hub-field__label" for="resource-url">URL</label>
      <input id="resource-url" class="hub-input" formControlName="url" />
    </div>

    <div class="hub-field">
      <label class="hub-field__label" for="resource-description">Description</label>
      <textarea
        id="resource-description"
        class="hub-textarea"
        formControlName="description"
        rows="4"
      ></textarea>
    </div>

    <div class="hub-field">
      <label class="hub-field__label" for="resource-category">Category</label>
      <input id="resource-category" class="hub-input" formControlName="category" />
    </div>

    <div class="hub-field">
      <label class="hub-field__label" for="resource-type">Type</label>
      <select id="resource-type" class="hub-select" formControlName="type">
        @for (resourceType of resourceTypes; track resourceType) {
          <option [ngValue]="resourceType">{{ resourceType }}</option>
        }
      </select>
    </div>

    <div class="hub-field">
      <label class="hub-field__label" for="resource-status">Status</label>
      <select id="resource-status" class="hub-select" formControlName="status">
        @for (resourceStatus of resourceStatuses; track resourceStatus) {
          <option [ngValue]="resourceStatus">{{ resourceStatus }}</option>
        }
      </select>
    </div>
  </form>
</div>

<div class="hub-modal__actions">
  <button class="hub-btn" type="button" (click)="onCancel()">Cancel</button>
  <button
    class="hub-btn hub-btn--primary"
    [disabled]="fg.invalid"
    type="button"
    (click)="submitForm()"
  >
    {{ mode === 'create' ? 'Add resource' : 'Save resource' }}
  </button>
</div>
