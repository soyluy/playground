<h2 class="hub-modal__title">Filter Resources</h2>

<div class="hub-modal__body">
  <form [formGroup]="form" class="hub-modal__body">
    <div class="hub-field">
      <label class="hub-field__label" for="resource-filter-type">Type</label>
      <select id="resource-filter-type" class="hub-select" formControlName="type">
        <option [ngValue]="null">Any</option>
        @for (resourceType of resourceTypes; track resourceType) {
          <option [ngValue]="resourceType">{{ resourceType }}</option>
        }
      </select>
    </div>

    <div class="hub-field">
      <label class="hub-field__label" for="resource-filter-status">Status</label>
      <select id="resource-filter-status" class="hub-select" formControlName="status">
        <option [ngValue]="null">Any</option>
        @for (resourceStatus of resourceStatuses; track resourceStatus) {
          <option [ngValue]="resourceStatus">{{ resourceStatus }}</option>
        }
      </select>
    </div>

    <div class="hub-field">
      <label class="hub-field__label" for="resource-filter-category">Category</label>
      <input
        id="resource-filter-category"
        class="hub-input"
        formControlName="category"
      />
    </div>
  </form>
</div>

<div class="hub-modal__actions">
  <button class="hub-btn" type="button" (click)="onCancelClick()">Cancel</button>
  <button class="hub-btn hub-btn--primary" type="button" (click)="onSubmitClick()">
    Apply
  </button>
</div>
