<div
  class="item"
  [class.income]="transaction().type === 'income'"
  [class.expense]="transaction().type === 'expense'"
>
  <div class="item__indicator"></div>

  <div class="item__body">
    <span class="item__description">{{ transaction().description }}</span>
    <span class="item__meta"
      >{{ transaction().category }} ·
      {{ transaction().date | date: 'MMM d, y' }}</span
    >
  </div>

  <span class="item__amount">
    {{ transaction().type === 'income' ? '+' : '−'
    }}{{ transaction().amount | currency: 'USD' : 'symbol' : '1.2-2' }}
  </span>

  <button class="item__edit" (click)="onEdit()" aria-label="Edit transaction">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
      <path
        d="M1 1l12 12M13 1L1 13"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
      />
    </svg>
  </button>

  <button
    class="item__delete"
    (click)="onDelete()"
    aria-label="Delete transaction"
  >
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
      <path
        d="M1 1l12 12M13 1L1 13"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
      />
    </svg>
  </button>
</div>
