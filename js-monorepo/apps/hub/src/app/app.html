<div class="shell">
  <header class="topbar" appScrollVisibility [scrollContainer]="contentElement">
    <div class="topbar__left">
      <h1 class="topbar__title">Hub</h1>
    </div>
    <div class="topbar__right">
      <button class="btn-auth" (click)="login()">Login</button>
      <button class="btn-auth" (click)="logout()">Logout</button>
    </div>
  </header>

  <div class="shell__body">
    <nav class="sidebar" [class.sidebar--expanded]="sidebarExpanded()">
      <button class="sidebar-toggle" (click)="toggleSidebar()">
        <span class="sidebar-toggle__icon">&#9776;</span>
      </button>
      <a
        class="sidebar__item"
        routerLink="/tag-management"
        routerLinkActive="sidebar__item--active"
      >
        <span class="sidebar__icon">⊞</span>
        <span class="sidebar__label">Tag Management</span>
      </a>
      <a
        class="sidebar__item"
        routerLink="/todo"
        routerLinkActive="sidebar__item--active"
      >
        <span class="sidebar__icon">☑</span>
        <span class="sidebar__label">Todo List</span>
      </a>
      <a
        class="sidebar__item"
        routerLink="/expense-tracker"
        routerLinkActive="sidebar__item--active"
      >
        <span class="sidebar__icon">◎</span>
        <span class="sidebar__label">Expense Tracker</span>
      </a>
      <a
        class="sidebar__item"
        routerLink="/resource"
        routerLinkActive="sidebar__item--active"
      >
        <span class="sidebar__icon">◈</span>
        <span class="sidebar__label">Resources</span>
      </a>
    </nav>

    <div
      class="backdrop"
      [class.backdrop--visible]="sidebarExpanded()"
      (click)="toggleSidebar()"
      (keydown)="toggleSidebar()"
      (keyup)="toggleSidebar()"
      (keypress)="toggleSidebar()"
      tabindex="0"
    ></div>

    <main class="content" #contentElement>
      <router-outlet />
    </main>
  </div>
</div>
