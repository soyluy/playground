name: Build Windows App

on:
  push:
    tags:
      - 'nerisa-v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build JAR
        run: mvn package
        working-directory: nerisa

      - name: Download JavaFX SDK
        run: | 
          curl -L https://download2.gluonhq.com/openjfx/21/openjfx-21_windows-x64_bin-sdk.zip -o javafx.zip 
          unzip javafx.zip

      - name: Copy JavaFX natives
        run: cp javafx-sdk-21/bin/*.dll nerisa/target/
        shell: bash

      - name: Build app-image
        shell: cmd
        run: jpackage --type app-image --name nerisa --input nerisa/target --main-jar nerisa-0.0.1-SNAPSHOT.jar --main-class soyluy.nerisa.App --module-path javafx-sdk-21/lib --add-modules javafx.controls --dest dist

      - name: Zip output
        run: Compress-Archive -Path dist/nerisa -DestinationPath nerisa-windows.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: nerisa-windows.zip