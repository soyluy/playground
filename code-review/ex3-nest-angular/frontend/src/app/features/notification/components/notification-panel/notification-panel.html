<aside class="notification-panel" [class.open]="isOpen()">
  <header class="panel-header">
    <h3>Notifications</h3>
    <button mat-icon-button type="button" aria-label="Close panel" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <div class="panel-actions">
    <span class="unread">{{ unreadCount() }} unread</span>
    <button mat-button type="button" (click)="markAllAsRead()" [disabled]="unreadCount() === 0">
      Mark all as read
    </button>
  </div>

  <div class="empty" *ngIf="!hasNotifications()">No notifications.</div>

  <div class="notifications" *ngIf="hasNotifications()">
    <article
      class="notification"
      *ngFor="let item of notifications(); trackBy: trackById"
      [class.read]="item.isRead"
      (click)="markAsRead(item.id)"
    >
      <div class="icon">
        <mat-icon>{{ item.isRead ? 'drafts' : 'notifications' }}</mat-icon>
      </div>
      <div class="content">
        <p class="title">{{ item.title }}</p>
        <p class="message">{{ item.message }}</p>
        <small>{{ item.createdAt | date: 'short' }}</small>
      </div>
    </article>
  </div>
</aside>
