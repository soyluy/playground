spring:
  application:
    name: order-processor
  profiles:
    active: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orderprocessor}
    username: ${DB_USER:orderprocessor}
    password: ${DB_PASSWORD:orderprocessor}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

app:
  datasource:
    pool:
      maximum-pool-size: 10
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  security:
    jwt:
      secret: ${JWT_SECRET:dev-secret-change-me-to-something-long-enough}
      access-ttl-ms: 900000
      refresh-ttl-ms: 604800000
      issuer: order-processor
  payment:
    gateway:
      url: ${PAYMENT_GATEWAY_URL:http://localhost:9090}
      api-key: ${PAYMENT_GATEWAY_KEY:}
  email:
    service:
      url: ${EMAIL_SERVICE_URL:http://localhost:9091}
      api-key: ${EMAIL_SERVICE_KEY:}
    from: no-reply@orderprocessor.local
  notifications:
    ops-email: ops@orderprocessor.local
  scheduler:
    order-timeout-minutes: 30
    order-timeout-check-ms: 60000
    low-stock-threshold: 10
    inventory-cron: "0 0 */1 * * *"
  async:
    core-size: 4
    max-size: 8
    queue-capacity: 1000
    keep-alive-seconds: 60
  http:
    connect-timeout-ms: 3000
    read-timeout-ms: 10000
  order:
    prefix: ORD
  pricing:
    promo-code: ""
    promo-percent: 0.00

logging:
  level:
    root: INFO
    com.orderprocessor: INFO
